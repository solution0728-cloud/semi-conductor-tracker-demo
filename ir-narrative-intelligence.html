<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IR Narrative Intelligence — 비공식 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#F7F7F5;--sidebar:#FAFAF9;--panel:#FFF;--text:#181818;--muted:#71717A;
--border:#E6E6E3;--border2:#F0F0EE;--sk-orange:#F47721;--sk-red:#EA002C;
--sk-orange-soft:#FFF1E8;--sk-red-soft:#FDEBEC;--sk-warm:#FFF8F3;
--teal:#0F6E62;--amber:#B47A00;--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box}html,body{margin:0;padding:0;height:100%}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;background:var(--bg);
color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;font-size:14px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0;text-align:left}
button:focus-visible{outline:2px solid var(--sk-orange);outline-offset:2px}
a{color:inherit}.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.shell{display:grid;grid-template-columns:222px minmax(0,1fr);min-height:100vh}
.shell[data-d="1"]{grid-template-columns:222px minmax(0,1fr) 352px}
.sidebar{background:var(--sidebar);border-right:1px solid var(--border);padding:22px 0 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 20px 22px}
.brand .top{display:flex;align-items:center;gap:7px}
.brand .dotb{width:9px;height:9px;border-radius:50%;background:var(--sk-orange);flex:0 0 9px}
.brand .co{font-size:15px;font-weight:700;letter-spacing:-.02em}
.brand .pr{font-size:12.5px;color:var(--muted);margin-top:1px}
.brand .un{display:inline-block;margin-top:7px;font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;
color:var(--muted);border:1px solid var(--border);border-radius:2px;padding:1px 5px}
.sgroup{margin-bottom:18px}
.sgroup h6{margin:0 0 4px;padding:0 20px;font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;font-weight:500}
.snav{display:flex;align-items:center;gap:9px;width:100%;padding:7px 20px;font-size:13.5px;color:#3F3F46;border-left:2px solid transparent}
.snav:hover{background:#F2F2F0}
.snav[data-on="1"]{color:var(--text);font-weight:600;border-left-color:var(--sk-orange);background:var(--sk-orange-soft)}
.snav .badge{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted)}
.snav .badge.hot{color:var(--sk-orange);font-weight:600}
.workspace{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:16px;padding:16px 34px;border-bottom:1px solid var(--border);
background:rgba(247,247,245,.92);position:sticky;top:0;z-index:5}
.tb-t{font-size:14px;font-weight:600;white-space:nowrap}
.tb-s{font-size:12px;color:var(--muted)}
.tb-r{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted);text-align:right;line-height:1.7}
.tb-r b{color:var(--text);font-weight:500}
.content{padding:34px;max-width:1000px}
h1{font-size:26px;font-weight:700;letter-spacing:-.025em;margin:0 0 6px;line-height:1.3}
h2{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:38px 0 2px}
h2:first-child{margin-top:0}
.lead{font-size:15px;color:var(--muted);margin:0 0 24px}
.sub{font-size:12.5px;color:var(--muted);margin:2px 0 16px}
.hr{height:1px;background:var(--border);margin:26px 0}
.stats{display:flex;flex-wrap:wrap;gap:34px;margin:20px 0 28px}
.stat b{display:block;font-size:27px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.stat b.hot{color:var(--sk-orange)}.stat b.bad{color:var(--sk-red)}
.stat span{font-size:12px;color:var(--muted)}
.rows{border-top:1px solid var(--border)}
.row{display:flex;gap:16px;width:100%;padding:15px 4px;border-bottom:1px solid var(--border2);align-items:flex-start}
.row:hover{background:#FCFCFB}
.row .main{flex:1;min-width:0}
.row .t{font-size:14.5px;font-weight:600;line-height:1.4}
.row .d{font-size:12.5px;color:var(--muted);margin-top:2px}
.row .arrow{color:var(--muted);font-size:13px;padding-top:2px}
.row:hover .arrow{color:var(--sk-orange)}
/* heatmap */
.hm{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
.hm th{font-family:var(--mono);font-size:9.5px;color:var(--muted);font-weight:500;text-align:center;padding:8px 5px;border-bottom:1px solid var(--border);vertical-align:bottom}
.hm th:first-child{text-align:left;width:34%}
.hm td{padding:0;border-bottom:1px solid var(--border2);text-align:center}
.hm td:first-child{text-align:left;padding:10px 8px 10px 0;font-weight:600;font-size:13px}
.hm td:first-child small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;margin-top:1px}
.hc{display:block;width:100%;padding:13px 4px;font-family:var(--mono);font-size:11px}
.g3{background:#3F3F46;color:#fff;font-weight:700}
.g2{background:#B8B8B2;color:#181818}
.g1{background:#ECECE8;color:#71717A}
.g0{background:#F7F7F5;color:#C4C4BE}
.hc[data-sel="1"]{outline:2px solid var(--sk-orange);outline-offset:-2px}
.us{color:var(--sk-orange)!important}
.legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:12px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.legend span i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
/* disclosure */
.dtab{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.dtab th{font-family:var(--mono);font-size:9.5px;color:var(--muted);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--border);text-align:center}
.dtab th:first-child{text-align:left;width:30%}
.dtab td{padding:9px 6px;border-bottom:1px solid var(--border2);text-align:center;font-family:var(--mono);font-size:14px}
.dtab td:first-child{text-align:left;font-family:inherit;font-size:13px;font-weight:600}
.dtab td:first-child small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;font-family:inherit}
.o{color:var(--teal);font-weight:600}.tri{color:var(--amber)}.x{color:var(--sk-red);font-weight:600}
.gapbar{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px;width:100%}
.gapbar .n{width:96px;flex:0 0 96px;font-weight:600}
.gapbar u{text-decoration:none;flex:1;height:9px;background:var(--border2);border-radius:2px;overflow:hidden}
.gapbar u i{display:block;height:100%;background:#3F3F46}
.gapbar u i.me{background:var(--sk-orange)}
.gapbar b{font-family:var(--mono);font-size:12px;width:52px;text-align:right;font-weight:500}
/* qa */
.qa{border:1px solid var(--border);border-radius:9px;padding:16px 18px;margin-bottom:11px;background:var(--panel)}
.qa[data-p="1"]{border-left:3px solid var(--sk-red)}
.qa[data-p="2"]{border-left:3px solid var(--sk-orange)}
.qa-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.qa-q{font-size:15px;font-weight:600;line-height:1.45;flex:1;min-width:0}
.qa-b{font-family:var(--mono);font-size:9px;letter-spacing:.07em;padding:3px 7px;border-radius:3px;white-space:nowrap}
.pb1{background:var(--sk-red-soft);color:var(--sk-red)}
.pb2{background:var(--sk-orange-soft);color:#8A3E00}
.pb3{background:#F0F0EE;color:var(--muted)}
.qa-s{display:grid;grid-template-columns:64px 1fr;gap:6px 12px;margin-top:12px;font-size:13px}
.qa-s dt{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;padding-top:4px}
.qa-s dd{margin:0;line-height:1.55}
.qa-s dd.pos{color:var(--sk-orange);font-weight:600}
.qa-s dd.risk{color:var(--sk-red)}
.srcline{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:11px;padding-top:9px;border-top:1px dotted var(--border)}
.srcline a{text-decoration:none}.srcline a:hover{color:var(--sk-orange)}
/* consistency */
.cons{padding:14px 0;border-bottom:1px solid var(--border2)}
.cons b{font-size:14px;font-weight:600}
.cons .pair{display:grid;grid-template-columns:1fr 24px 1fr;gap:10px;margin-top:9px;align-items:center}
.cons .pair div{font-size:12.5px;background:#FAFAF7;border-radius:6px;padding:9px 11px;line-height:1.5}
.cons .pair div small{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.09em;color:var(--muted);margin-bottom:3px}
.cons .pair .ar{text-align:center;color:var(--muted)}
.cons .flag{font-size:12.5px;margin-top:8px;color:var(--sk-orange);font-weight:600}
/* detail */
.detail{background:var(--panel);border-left:1px solid var(--border);padding:26px 24px 60px;position:sticky;top:0;height:100vh;overflow-y:auto}
.detail .close{float:right;color:var(--muted);font-size:16px}
.detail h3{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0 0 2px}
.detail .sub2{font-size:12.5px;color:var(--muted);margin-bottom:18px}
.dsec{margin-top:22px}
.dsec h5{margin:0 0 8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;color:var(--muted);text-transform:uppercase;font-weight:500}
.dsec p{margin:0;font-size:13.5px;line-height:1.65}
.dl{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--border2)}
.dl:last-child{border-bottom:none}
.dl span{color:var(--muted)}.dl b{font-weight:600;text-align:right}
.bigv{font-size:36px;font-weight:700;letter-spacing:-.03em;line-height:1}
.evc{border:1px solid var(--border);border-radius:8px;padding:11px 13px;margin-bottom:8px}
.evc-h{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px}
.bdg{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;padding:2px 6px;border-radius:3px;border:1px solid var(--border);color:var(--muted)}
.bdg.pri{background:#E3F0ED;color:var(--teal);border-color:#C7E2DC}
.evc a{font-size:12.5px;font-weight:600;text-decoration:none;display:block;line-height:1.45}
.evc a:hover{color:var(--sk-orange)}
.evc u{text-decoration:none;display:block;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px}
.meth{font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.75;background:var(--panel);
border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-top:20px}
.callout{background:var(--sk-orange-soft);border-left:3px solid var(--sk-orange);border-radius:0 6px 6px 0;padding:13px 15px;margin-top:14px}
.callout b{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:#8A3E00;margin-bottom:4px}
.callout p{margin:0;font-size:13.5px;line-height:1.6}
.cta{display:inline-flex;align-items:center;gap:6px;background:var(--sk-orange);color:#fff;font-size:12.5px;font-weight:600;padding:8px 15px;border-radius:6px;margin-top:8px}
.cta.g{background:none;color:var(--text);border:1px solid var(--border)}
.pill{display:inline-block;font-family:var(--mono);font-size:10px;padding:3px 9px;border-radius:20px;border:1px solid var(--border);margin:0 5px 5px 0}
.pill.on{background:var(--text);color:#fff;border-color:var(--text)}
@media(max-width:1150px){.shell[data-d="1"]{grid-template-columns:222px minmax(0,1fr)}
 .detail{position:fixed;right:0;top:0;width:348px;z-index:20;box-shadow:-8px 0 24px rgba(0,0,0,.08)}}
@media(max-width:820px){.shell,.shell[data-d="1"]{grid-template-columns:1fr}
 .sidebar{position:static;height:auto}.content{padding:22px}.topbar{padding:14px 22px}
 .detail{width:100%}.cons .pair{grid-template-columns:1fr}.hm td:first-child{font-size:11.5px}
 .hc{padding:10px 2px;font-size:9.5px}.qa-s{grid-template-columns:1fr}}

.na{color:#C4C4BE}
.rc{font-family:var(--mono);font-size:9px;padding:3px 8px;border-radius:3px;white-space:nowrap}
.rc-CLOSE{background:var(--sk-orange);color:#fff;font-weight:600}
.rc-KEEP{background:#F0F0EE;color:var(--muted)}
.rc-NO{background:var(--sk-red-soft);color:var(--sk-red);font-weight:600}
.todo{border:1px solid var(--border);border-radius:9px;padding:15px 17px;margin-bottom:9px;background:var(--panel);width:100%;display:flex;gap:14px;align-items:flex-start}
.todo:hover{border-color:var(--sk-orange)}
.todo .n{font-family:var(--mono);font-size:20px;font-weight:600;width:26px;flex:0 0 26px;color:var(--sk-orange);line-height:1.1}
.todo .m{flex:1}
.todo .t{font-size:14.5px;font-weight:600}
.todo .d{font-size:12.5px;color:var(--muted);margin-top:2px}
.modes{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;width:fit-content;margin-bottom:20px}
.modes button{padding:7px 16px;font-size:12.5px;background:var(--panel);font-family:var(--mono);letter-spacing:.06em}
.modes button+button{border-left:1px solid var(--border)}
.modes button[data-on="1"]{background:#3F3F46;color:#fff;font-weight:600}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ════════════════════════════════════════════════════════════
   IR Narrative Intelligence — 비공식 개인 데모
   피어 IR 메시지 · 공시 수준 비교 → 우리 메시지의 공백 도출
   실적 수치와 발언은 2026-08-09 기준 실제 공개 자료. 등급·권고는 추정.
   ════════════════════════════════════════════════════════════ */
const ASOF="2026-08-09";
const COS=["SK하이닉스","마이크론","삼성전자","TSMC","엔비디아"];
const TICK={"SK하이닉스":"KRX 000660","마이크론":"NASDAQ MU","삼성전자":"KRX 005930","TSMC":"NYSE TSM","엔비디아":"NASDAQ NVDA"};

/* ── 메시지 축 : 무엇을 앞세워 피칭하는가 (0~3) ── */
const AXES=[
{a:"기술 리더십",d:"세대·성능·수율을 전면에",
 v:{"SK하이닉스":[3,"품질·수율 기반 HBM 리더십을 첫 문장에 배치. HBM4 양산 출하, HBM4E 12단 샘플 공급 완료를 강조"],
  "마이크론":[3,"HBM4 성능(>11Gb/s)·전력효율을 수치로 제시"],
  "삼성전자":[2,"공정 전환·수율 개선 중심"],
  "TSMC":[3,"노드 로드맵과 선단 패키징을 축으로"],
  "엔비디아":[3,"아키텍처 세대 전환을 서사의 중심에"]}},
{a:"캐파 · 공급능력",d:"팹·증설·가동 일정을 구체적으로",
 v:{"SK하이닉스":[2,"용인 Y2·청주 M17 54.3조 의결, M15X 양산 앞당김. 다만 팹별 산출 규모는 비공개"],
  "마이크론":[3,"아이다호 1·2팹, 뉴욕, 싱가포르, 인도까지 사이트별 가동 시점을 개별 제시"],
  "삼성전자":[2,"평택 중심 언급, 세부 일정 제한적"],
  "TSMC":[3,"거점별 확장과 캐파 계획을 정례 공개"],
  "엔비디아":[1,"공급 제약은 언급하되 자체 캐파는 해당 없음"]}},
{a:"수요 가시성",d:"sold out · 장기계약으로 미래 매출을 못 박기",
 v:{"SK하이닉스":[2,"10여 개 고객사와 LTA 협상 완료를 언급했으나 가격·물량 조건은 비공개"],
  "마이크론":[3,"2026년 HBM 소진(sold out), 가격·물량이 확정된 다년 계약을 명시"],
  "삼성전자":[1,"고객 확대를 정성적으로만"],
  "TSMC":[2,"고객 수요 강세를 정성적으로"],
  "엔비디아":[3,"수요가 공급을 초과한다는 메시지를 반복 배치"]}},
{a:"수익성 · 믹스",d:"마진 구조와 제품 믹스를 숫자로",
 v:{"SK하이닉스":[3,"영업이익률 76%, 고부가 제품 중심 판매를 명시"],
  "마이크론":[3,"GM 가이던스를 분기마다 수치로 제시"],
  "삼성전자":[2,"부문별 실적 중심"],
  "TSMC":[3,"GM·OPM 가이던스 정례 제공"],
  "엔비디아":[3,"GM 가이던스 제공"]}},
{a:"주주환원",d:"잉여현금 배분 원칙을 선언",
 v:{"SK하이닉스":[1,"순현금 69.4조 원 공개. 배분 원칙·목표는 별도 제시 없음"],
  "마이크론":[3,"잉여현금 100% 주주환원 방침, 분기 배당 30% 인상 발표"],
  "삼성전자":[2,"주주환원 정책 별도 운영"],
  "TSMC":[2,"배당 정책 유지"],
  "엔비디아":[3,"자사주 매입 규모를 정례 공표"]}},
{a:"공급 규율",d:"과잉투자를 하지 않겠다는 절제 메시지",
 v:{"SK하이닉스":[2,"수급 상황에 맞춘 투자 기조 언급"],
  "마이크론":[3,"시장 상황에 맞춰 공급계획을 조정하겠다는 절제 문구를 반복 배치"],
  "삼성전자":[1,"상대적으로 약함"],
  "TSMC":[2,"규율 있는 자본지출 강조"],
  "엔비디아":[1,"해당 없음"]}},
{a:"지정학 · 규제",d:"수출통제·거점 리스크를 선제적으로 다루기",
 v:{"SK하이닉스":[1,"중국 라인 관련 언급이 제한적"],
  "마이크론":[2,"가이던스에 지정학 영향 미반영임을 명시"],
  "삼성전자":[1,"제한적"],
  "TSMC":[2,"해외 거점 확장 맥락에서 언급"],
  "엔비디아":[3,"대중 수출 이슈를 실적 서사에 직접 편입"]}}];

/* ── 공시 항목 : 무엇을 숫자로 공개하는가
   값 2=수치공개 1=부분 0=미공개 -1=사업구조상 해당없음(분모 제외)

 +'외국인 애널리스트가 먼저 물어볼 가능성이 높고, 그때는 준비 없이 받게 됩니다.</p></div>'

function vCase(){
 return '<h1>Message vs Market</h1><p class="lead">2026년 2분기 · '+esc(CASE.head)+'</p>'

function vQA(){
 const P={1:"우선 대비",2:"대비 필요",3:"기존 기조 유지"};
 return '<h1>Q&amp;A Preparation</h1>'
 +'<p class="lead">외부 신호에서 도출한 예상 질문. 각 항목에 왜 나오는지 · 현재 공개 수준 · 답변 리스크 · 권고 포지셔닝이 붙습니다.</p>'

  +items.map(q=>'<div class="qa" data-p="'+p+'"><div class="qa-h"><div class="qa-q">'+esc(q.q)+'</div>'
   +'<span class="qa-b pb'+p+'">P'+p+'</span></div>'
   +'<dl class="qa-s"><dt>Why</dt><dd>'+esc(q.why)+'</dd>'
   +'<dt>현재</dt><dd>'+esc(q.now)+'</dd>'
   +'<dt class="risk">Risk</dt><dd class="risk">'+esc(q.risk)+'</dd>'
   +'<dt>권고</dt><dd class="pos">'+esc(q.pos)+'</dd></dl>'
   +'<div class="srcline">'+q.src.map(s=>'<a href="'+s[1]+'" target="_blank" rel="noopener">'+esc(s[2])+' ↗</a>').join(" · ")+'</div>'
   +'</div>').join("");}).join("")
 +'<div class="meth">Risk와 권고는 이 도구의 판단이며 법무·공시 검토를 대체하지 않습니다. '
 +'특히 미공개 중요정보 해당 여부와 공정공시 의무는 별도 확인이 필요합니다.</div>';
}
function detail(){
 if(S.detail==="cell"&&S.cell){
  const[k,a,c]=S.cell.split("|");
  const row=k==="A"?AXES.find(x=>x.a===a):DISC.find(x=>x.k===a);
  if(!row)return "";
  const cell=row.v[c],lv=k==="A"?MK[cell[0]]:dk(cell[0]);
  const others=COS.filter(x=>x!==c).map(x=>[x,row.v[x]]);
  return '<button class="close" data-a="close">✕</button>'
  +'<div class="mono" style="font-size:10px;color:var(--muted)">'+(k==="A"?"MESSAGE AXIS":"DISCLOSURE")+' · '+esc(a)+'</div>'
  +'<h3>'+esc(c)+'</h3><div class="sub2">'+esc(TICK[c])+'</div>'
  +'<div class="bigv">'+lv+'</div>'
  +'<div class="dsec"><h5>근거</h5><p>'+esc(cell[1])+'</p></div>'
  +'<div class="dsec"><h5>다른 회사</h5>'
  +others.map(o=>'<div class="dl"><span>'+esc(o[0])+'</span><b>'+(k==="A"?MK[o[1][0]]:dk(o[1][0]))+'</b></div>').join("")+'</div>'
  +(k==="D"?'<div class="dsec"><h5>가중치</h5><p>'+row.w+' / 3 — '+esc(row.d)+'</p></div>':'')
  +'<div class="meth" style="margin-top:18px">등급은 공개 자료 기준 상대 평가입니다.</div>';
 }
 if(S.detail==="qa"&&S.qa!==null){
  const q=QA[S.qa];
  return '<button class="close" data-a="close">✕</button>'
  +'<div class="mono" style="font-size:10px;color:var(--muted)">EXPECTED QUESTION · P'+q.p+'</div>'
  +'<h3 style="font-size:17px">'+esc(q.q)+'</h3>'
  +'<div class="dsec"><h5>왜 나오는가</h5><p>'+esc(q.why)+'</p></div>'
  +'<div class="dsec"><h5>현재 공개 수준</h5><p>'+esc(q.now)+'</p></div>'
  +'<div class="dsec"><h5>답변 리스크</h5><p style="color:var(--sk-red)">'+esc(q.risk)+'</p></div>'
  +'<div class="dsec"><h5>권고 포지셔닝</h5><p style="color:var(--sk-orange);font-weight:600">'+esc(q.pos)+'</p></div>'
  +'<div class="dsec"><h5>근거 원문</h5>'+q.src.map(srcRow).join("")+'</div>';
 }
 if(S.detail==="disc"&&S.cell){
  const d=DISC.find(x=>x.k===S.cell);if(!d)return "";
  return '<button class="close" data-a="close">✕</button>'
  +'<div class="mono" style="font-size:10px;color:var(--muted)">DISCLOSURE GAP</div>'
  +'<h3>'+esc(d.k)+'</h3><div class="sub2">'+esc(d.d)+' · 가중치 '+d.w+'/3</div>'
  +'<div class="dsec"><h5>회사별 수준</h5>'
  +COS.map(c=>'<div class="dl"><span'+(c==="SK하이닉스"?' style="color:var(--sk-orange);font-weight:600"':'')+'>'+esc(c)+'</span>'
   +'<b class="'+dcls(d.v[c][0])+'">'+dk(d.v[c][0])+'</b></div>').join("")+'</div>'
  +COS.map(c=>'<div class="dsec"><h5>'+esc(c)+'</h5><p style="font-size:12.5px">'+esc(d.v[c][1])+'</p></div>').join("");
 }
 if(S.detail==="co"&&S.co){
  const c=S.co;
  return '<button class="close" data-a="close">✕</button><h3>'+esc(c)+'</h3>'
  +'<div class="sub2">'+esc(TICK[c])+'</div>'
  +'<div class="bigv">'+discScore(c)+'<span style="font-size:15px;color:var(--muted)"> / 100</span></div>'
  +'<div class="mono" style="font-size:10px;color:var(--muted);margin-top:4px">공시 수준 지수 · 자체 산출</div>'
  +'<div class="dsec"><h5>메시지 축</h5>'
  +AXES.map(a=>'<div class="dl"><span>'+esc(a.a)+'</span><b>'+MK[a.v[c][0]]+'</b></div>').join("")+'</div>'
  +'<div class="dsec"><h5>수치 공개 항목</h5>'
  +DISC.filter(d=>d.v[c][0]===2).map(d=>'<div class="dl"><span>'+esc(d.k)+'</span><b class="o">○</b></div>').join("")
  +(DISC.filter(d=>d.v[c][0]===2).length?"":'<p style="color:var(--muted);font-size:12.5px">없음</p>')+'</div>'
  +'<div class="dsec"><h5>미공개 항목</h5>'
  +DISC.filter(d=>d.v[c][0]===0).map(d=>'<div class="dl"><span>'+esc(d.k)+'</span><b class="x">✕</b></div>').join("")+'</div>';
 }
 return "";
}
const NAV=[{g:"OVERVIEW",items:[["home","Home"]]},
 {g:"PEER ANALYSIS",items:[["axes","Peer Message Map"],["disc","Disclosure Matrix"],["trend","Question Trend"]]},
 {g:"THIS QUARTER",items:[["call","Earnings Call Teardown"],["case","Message vs Market"],["qa","Q&A Preparation"],["exp","Expectation Mgmt"]]}];
const TITLES={home:["Home","IR 메시지 인텔리전스"],axes:["Peer Message Map","무엇을 앞세우는가"],
 disc:["Disclosure Matrix","무엇을 숫자로 공개하는가"],call:["Earnings Call Teardown","컨콜 분해"],case:["Message vs Market","2Q26 케이스"],
 qa:["Q&A Preparation","다음 콜 대비"],exp:["Expectation Management","기대치 관리"],trend:["Question Trend","반복 질문 추적"]};
function render(){

  +(i[0]==="disc"?'<span class="badge hot">'+gaps+'</span>':'')
  +(i[0]==="qa"?'<span class="badge hot">'+p1+'</span>':'')+(i[0]==="call"?'<span class="badge hot">'+CALL.corr.length+'</span>':'')+(i[0]==="trend"?'<span class="badge hot">'+UNANS.length+'</span>':'')+'</button>').join("")+'</div>').join("");
 const t=TITLES[S.view],dp=detail();
 document.getElementById("app").innerHTML=
 '<div class="shell" data-d="'+(dp?1:0)+'">'
 +'<aside class="sidebar"><div class="brand"><div class="top"><span class="dotb"></span>'
 +'<div class="co">SK hynix</div></div><div class="pr">IR Narrative Intelligence</div>'
 +'<div class="un">비공식 · 개인 데모</div></div>'+nav+'</aside>'
 +'<main class="workspace"><header class="topbar">'
 +'<span class="tb-t">'+esc(t[0])+'</span><span class="tb-s">'+esc(t[1])+'</span>'
 +'<div class="tb-r">AS OF <b>'+ASOF.replace(/-/g,".")+'</b> · 피어 <b>'+COS.length+'</b><br>'
 +'메시지 축 <b>'+AXES.length+'</b> · 공시 항목 <b>'+DISC.length+'</b></div></header>'
 +'<section class="content">'+V[S.view]()
 +'<p style="font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.9;margin-top:38px;padding-top:16px;border-top:1px solid var(--border)">'
 +'실적 수치 · IR 발언 · 가이던스는 2026-08-09까지 공개된 실적발표 자료와 컨퍼런스콜 내용이며 원문 링크가 붙어 있습니다. '
 +'메시지 축 등급 · 공시 수준 지수 · 답변 리스크 · 권고 포지셔닝은 이 도구의 판단이며 공식 견해도, 법무·공시 검토도 아닙니다. '
 +'개인 데모입니다.</p></section></main>'
 +(dp?'<aside class="detail">'+dp+'</aside>':'')+'</div>';
}
document.getElementById("app").addEventListener("click",e=>{
 const el=e.target.closest("[data-a]");if(!el)return;
 const a=el.dataset.a,v=el.dataset.v;
 if(a==="nav"){S.view=v;S.detail=null;S.cell=null;S.qa=null;}
 else if(a==="cell"){S.cell=v;S.detail="cell";}
 else if(a==="qa"){S.qa=+v;S.detail="qa";}
 else if(a==="disc"){S.cell=v;S.detail="disc";}
 else if(a==="co"){S.co=v;S.detail="co";}
 else if(a==="mode"){S.mode=v;}
 else if(a==="close"){S.detail=null;S.cell=null;S.qa=null;}
 render();
 if(a==="nav")window.scrollTo(0,0);
});
render();
