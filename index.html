<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SK hynix Strategic Intelligence — 비공식 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
 --bg:#F7F7F5;--sidebar:#FAFAF9;--panel:#FFF;--text:#181818;--muted:#71717A;
 --border:#E6E6E3;--border2:#F0F0EE;
 --sk-orange:#F47721;--sk-red:#EA002C;--sk-orange-soft:#FFF1E8;--sk-red-soft:#FDEBEC;--sk-warm:#FFF8F3;
 --teal:#0F6E62;--amber:#B47A00;
 --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}html,body{margin:0;padding:0;height:100%}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;
 background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;font-size:14px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0;text-align:left}
button:focus-visible{outline:2px solid var(--sk-orange);outline-offset:2px}
a{color:inherit}input{font:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.shell[data-detail="1"]{grid-template-columns:224px minmax(0,1fr) 360px}
.sidebar{background:var(--sidebar);border-right:1px solid var(--border);padding:22px 0 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 20px 22px}
.brand .top{display:flex;align-items:center;gap:7px}
.brand .dotb{width:9px;height:9px;border-radius:50%;background:var(--sk-orange);flex:0 0 9px}
.brand .co{font-size:15px;font-weight:700;letter-spacing:-.02em}
.brand .pr{font-size:12.5px;color:var(--muted);margin-top:1px}
.brand .un{display:inline-block;margin-top:7px;font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;
 color:var(--muted);border:1px solid var(--border);border-radius:2px;padding:1px 5px}
.sgroup{margin-bottom:18px}
.sgroup h6{margin:0 0 4px;padding:0 20px;font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;font-weight:500}
.snav{display:flex;align-items:center;gap:9px;width:100%;padding:7px 20px;font-size:13.5px;color:#3F3F46;border-left:2px solid transparent}
.snav:hover{background:#F2F2F0}
.snav[data-on="1"]{color:var(--text);font-weight:600;border-left-color:var(--sk-orange);background:var(--sk-orange-soft)}
.snav .badge{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted)}
.snav .badge.hot{color:var(--sk-orange);font-weight:600}
.recent{padding:0 20px}
.recent button{display:block;width:100%;font-size:12.5px;color:var(--muted);padding:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent button:hover{color:var(--text)}
.workspace{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:18px;padding:16px 34px;border-bottom:1px solid var(--border);
 background:rgba(247,247,245,.92);backdrop-filter:blur(6px);position:sticky;top:0;z-index:5}
.tb-t{font-size:14px;font-weight:600;white-space:nowrap}
.tb-s{font-size:12px;color:var(--muted);white-space:nowrap}
.tb-search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:7px 12px;min-width:230px}
.tb-search input{border:none;outline:none;background:none;width:100%;font-size:13px}
.tb-search span{color:var(--muted);font-size:13px}
.tb-act{display:flex;gap:6px}
.tb-act button{font-size:12.5px;color:var(--muted);padding:6px 11px;border-radius:5px;white-space:nowrap}
.tb-act button:hover{background:var(--panel);color:var(--text)}
.content{padding:34px;max-width:980px}
.content.wide{max-width:none}
.segs{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;width:fit-content;margin-bottom:22px;flex-wrap:wrap}
.segs button{padding:7px 15px;font-size:12.5px;background:var(--panel);white-space:nowrap}
.segs button+button{border-left:1px solid var(--border)}
.segs button[data-on="1"]{background:var(--sk-orange);color:#fff;font-weight:600}
h1{font-size:26px;font-weight:700;letter-spacing:-.025em;margin:0 0 6px;line-height:1.3}
h2{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:38px 0 2px}
h2:first-child{margin-top:0}
.lead{font-size:15px;color:var(--muted);margin:0 0 26px}
.sub{font-size:12.5px;color:var(--muted);margin:2px 0 18px}
.hr{height:1px;background:var(--border);margin:26px 0}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:34px;align-items:start}
.ask{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.ask input{width:100%;border:none;outline:none;font-size:15.5px;background:none;padding:2px 0 12px}
.ask-b{display:flex;align-items:center;gap:10px;border-top:1px solid var(--border2);padding-top:11px}
.ask-b .tag{font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--border);border-radius:20px;padding:3px 10px}
.ask-b .go{margin-left:auto;background:var(--sk-orange);color:#fff;font-size:12.5px;font-weight:600;padding:7px 16px;border-radius:6px}
.sugg button{display:block;width:100%;padding:9px 0;font-size:13.5px;color:#3F3F46;border-bottom:1px solid var(--border2)}
.sugg button:hover{color:var(--sk-orange)}
.sugg button:last-child{border-bottom:none}
.answer{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:20px 22px;margin:20px 0}
.answer .q{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.answer .a{font-size:15px;line-height:1.7}
.answer ul{margin:10px 0 0;padding-left:18px}
.stats{display:flex;flex-wrap:wrap;gap:36px;margin:22px 0 30px}
.stat b{display:block;font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.stat b.hot{color:var(--sk-orange)}
.stat span{font-size:12px;color:var(--muted)}
.rows{border-top:1px solid var(--border)}
.row{display:flex;align-items:flex-start;gap:18px;width:100%;padding:16px 4px;border-bottom:1px solid var(--border2)}
.row:hover{background:#FCFCFB}
.row .idx{font-family:var(--mono);font-size:11px;color:var(--muted);width:20px;flex:0 0 20px;padding-top:3px}
.row .main{flex:1;min-width:0}
.row .t{font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.4}
.row .d{font-size:13px;color:var(--muted);margin-top:2px}
.row .m{display:flex;gap:16px;margin-top:8px;flex-wrap:wrap}
.row .m span{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.row .m span b{color:var(--text);font-weight:600}
.row .arrow{color:var(--muted);font-size:13px;padding-top:3px}
.row:hover .arrow{color:var(--sk-orange)}
.act-line{font-size:13px;color:var(--sk-orange);font-weight:600;margin-top:9px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--sk-red);flex:0 0 6px;margin-top:9px}
.thead{display:flex;gap:14px;padding:0 4px 8px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.trow{display:flex;gap:14px;align-items:center;width:100%;padding:14px 4px;border-bottom:1px solid var(--border2)}
.trow:hover{background:#FCFCFB}
.trow[data-on="1"]{background:var(--panel);box-shadow:inset 2px 0 0 var(--sk-orange)}
.c-name{flex:1;min-width:0}
.c-name b{font-size:14.5px;font-weight:600;display:block;letter-spacing:-.01em}
.c-name span{font-size:12.5px;color:var(--muted)}
.c-num{width:52px;flex:0 0 52px;text-align:right;font-family:var(--mono);font-size:15px;font-weight:500}
.c-d{width:56px;flex:0 0 56px;text-align:right;font-family:var(--mono);font-size:12.5px}
.c-c{width:74px;flex:0 0 74px;font-size:12px;color:var(--muted)}
.c-a{width:78px;flex:0 0 78px;font-family:var(--mono);font-size:10.5px}
.up{color:var(--teal)}.down{color:var(--sk-red)}.pos{color:var(--sk-orange);font-weight:600}
.a-SECURE{color:var(--sk-red)}.a-INVEST{color:var(--sk-orange)}.a-PARTNER{color:#2B4A6B}
.a-ENGAGE{color:var(--teal)}.a-WATCH{color:var(--muted)}.a-MA{color:var(--text)}
@media(max-width:900px){.c-c,.thead .c-c{display:none}}
.mv{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border2);width:100%}
.mv:last-child{border-bottom:none}
.mv .n{flex:1;font-size:13.5px;font-weight:600}
.mv .bar{width:88px;flex:0 0 88px;height:4px;background:var(--border);border-radius:2px;position:relative;overflow:hidden}
.mv .bar i{position:absolute;top:0;bottom:0;background:var(--teal)}
.mv .bar i.neg{background:var(--sk-red)}
.mv .v{font-family:var(--mono);font-size:13px;width:38px;text-align:right;flex:0 0 38px;font-weight:500}
.side h6{margin:0 0 10px;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;color:var(--muted);text-transform:uppercase;font-weight:500}
.side+.side{margin-top:30px}
.sl{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:12.5px;width:100%}
.sl .n{flex:1}
.sl u{text-decoration:none;width:52px;flex:0 0 52px;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.sl u i{display:block;height:100%;background:#3F3F46}
.sl u i.crit{background:var(--sk-red)}
.sl b{font-family:var(--mono);font-size:11.5px;width:24px;text-align:right;font-weight:500}
.asum{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid var(--border2)}
.asum:last-child{border-bottom:none}
.asum b{font-family:var(--mono);font-weight:600}
/* SAGA flow */
.saga{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-top:12px}
.sg{display:flex;align-items:flex-start;gap:14px;padding:7px 0}
.sg .k{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;color:var(--muted);width:64px;flex:0 0 64px;padding-top:4px;text-transform:uppercase}
.sg .v{flex:1;font-size:13.5px;font-weight:600;line-height:1.45}
.sg .v small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:1px}
.sg.act .v{color:var(--sk-orange)}
.sgd{color:var(--border);font-size:12px;padding-left:74px;line-height:1}
/* tree */
.tnode{width:100%;display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--border2)}
.tnode:hover{background:#FCFCFB}
.tnode[data-on="1"]{background:var(--panel);box-shadow:inset 2px 0 0 var(--sk-orange)}
.tnode .nm{flex:1;min-width:0}
.tnode .nm b{font-weight:600}
.tnode .nm span{display:block;font-size:12px;color:var(--muted)}
.tnode .ex{font-family:var(--mono);font-size:14px;width:38px;text-align:right;flex:0 0 38px}
.ex-hi{color:var(--sk-red);font-weight:600}.ex-md{color:var(--amber)}.ex-lo{color:var(--muted)}
.ind{padding-left:22px;border-left:1px solid var(--border);margin-left:6px}
/* material */
.mat{padding:18px 0;border-bottom:1px solid var(--border2)}
.mat:last-child{border-bottom:none}
.mat h4{margin:0;font-size:14.5px;font-weight:600;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.mat h4 em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--muted)}
.mat .note{font-size:12.5px;color:var(--muted);margin-top:3px}
.mbar{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:12.5px;width:100%}
.mbar:hover .c{color:var(--sk-orange)}
.mbar .c{width:64px;flex:0 0 64px;color:var(--muted)}
.mbar u{text-decoration:none;flex:1;height:9px;background:var(--border2);border-radius:2px;overflow:hidden}
.mbar u i{display:block;height:100%}
.mbar u i.l3{background:#3F3F46}.mbar u i.l2{background:#9C9C96}.mbar u i.l1{background:#D6D6D1}
.mbar b{font-family:var(--mono);font-size:10.5px;width:62px;text-align:right;color:var(--muted);font-weight:400}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.chipx{font-size:11.5px;border:1px solid var(--border);border-radius:20px;padding:3px 10px;background:var(--panel)}
.chipx:hover{border-color:var(--sk-orange);color:var(--sk-orange)}
.mmeta{display:flex;gap:18px;margin-top:9px;flex-wrap:wrap}
.mmeta div{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.mmeta div b{display:block;font-size:12px;color:var(--text);font-weight:600;margin-top:1px;text-transform:none;letter-spacing:0}
/* heatmap — grayscale */
.hmap{width:100%;border-collapse:collapse;margin-top:8px}
.hmap th{font-family:var(--mono);font-size:9.5px;color:var(--muted);font-weight:500;text-align:center;padding:8px 6px;border-bottom:1px solid var(--border)}
.hmap th:first-child{text-align:left}
.hmap td{padding:0;border-bottom:1px solid var(--border2);text-align:center}
.hmap td:first-child{text-align:left;font-weight:600;font-size:13.5px;padding:11px 8px 11px 0}
.hc{display:block;width:100%;padding:12px 6px;font-family:var(--mono);font-size:10px;text-align:center}
.h3{background:#3F3F46;color:#fff;font-weight:700}
.h2{background:#B8B8B2;color:#181818}
.h1{background:#ECECE8;color:#71717A}
.h0{background:#F7F7F5;color:#C4C4BE}
.hc[data-sel="1"]{outline:2px solid var(--sk-orange);outline-offset:-2px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.legend span i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
/* calendar */
.cal{border-left:2px solid var(--border);margin-left:8px;padding-left:0}
.calq{position:relative;padding:0 0 4px 22px}
.calq h5{margin:16px 0 6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--muted)}
.calq::before{content:'';position:absolute;left:-6px;top:22px;width:9px;height:9px;border-radius:50%;background:var(--border);border:2px solid var(--bg)}
.calq[data-soon="1"]::before{background:var(--sk-orange)}
.calq[data-soon="1"] h5{color:var(--sk-orange)}
.ci{display:flex;gap:12px;width:100%;padding:9px 0;border-bottom:1px solid var(--border2);align-items:flex-start}
.ci:last-child{border-bottom:none}
.ci .t{flex:1;font-size:13.5px;font-weight:600}
.ci .t small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:1px}
.ci .a{font-family:var(--mono);font-size:10px;white-space:nowrap;padding-top:3px}
/* dep graph */
.dg{font-size:13.5px}
.dgn{display:flex;align-items:center;gap:10px;padding:7px 0}
.dgn b{font-weight:600}
.dgn span{font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--border);border-radius:3px;padding:1px 6px}
.dgn .ex{margin-left:auto;font-family:var(--mono);font-size:12px}
.dgi{padding-left:20px;border-left:1px solid var(--border);margin-left:5px}
/* detail */
.detail{background:var(--panel);border-left:1px solid var(--border);padding:26px 24px 60px;position:sticky;top:0;height:100vh;overflow-y:auto}
.detail .close{float:right;color:var(--muted);font-size:16px;line-height:1}
.detail h3{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0 0 2px;line-height:1.3}
.detail .sub2{font-size:12.5px;color:var(--muted);margin-bottom:18px}
.big{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1}
.big em{font-style:normal;font-size:15px;margin-left:8px}
.dsec{margin-top:22px}
.dsec h5{margin:0 0 8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;color:var(--muted);text-transform:uppercase;font-weight:500}
.dsec p{margin:0;font-size:13.5px;line-height:1.65}
.dl{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--border2)}
.dl:last-child{border-bottom:none}
.dl span{color:var(--muted)}
.dl b{font-weight:600;text-align:right}
.why-i{font-size:13.5px;padding:4px 0;display:flex;gap:8px}
.why-i i{font-style:normal;font-weight:700;flex:0 0 10px}
.why-i i.p{color:var(--teal)}.why-i i.m{color:var(--sk-red)}
.bar2{display:flex;align-items:center;gap:9px;margin-top:6px}
.bar2 span{font-family:var(--mono);font-size:10px;color:var(--muted);width:78px;flex:0 0 78px}
.bar2 u{text-decoration:none;flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.bar2 u i{display:block;height:100%;background:#3F3F46}
.bar2 b{font-family:var(--mono);font-size:11.5px;width:22px;text-align:right;font-weight:500}
.cmpr{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px}
.cmpr .n{width:88px;flex:0 0 88px;font-weight:600}
.cmpr .p{flex:1;display:flex;gap:2px}
.cmpr .p i{flex:1;height:5px;background:var(--border);border-radius:1px}
.cmpr .p i[data-on="1"]{background:#3F3F46}
.cmpr[data-us="1"] .p i[data-on="1"]{background:var(--sk-orange)}
.cmpr .s{font-family:var(--mono);font-size:10px;color:var(--muted);width:70px;flex:0 0 70px;text-align:right}
.cmpr .mvv{font-family:var(--mono);font-size:11px;width:14px;flex:0 0 14px;text-align:center}
/* evidence card */
.evc{border:1px solid var(--border);border-radius:8px;padding:12px 13px;margin-bottom:9px;background:var(--panel)}
.evc-h{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.bdg{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;padding:2px 6px;border-radius:3px;border:1px solid var(--border);color:var(--muted)}
.bdg.pri{background:#E3F0ED;color:var(--teal);border-color:#C7E2DC}
.bdg.loc{background:var(--sk-orange-soft);color:#8A3E00;border-color:#F6D9C2}
.bdg.lang{background:#EEF1F6;color:#2B4A6B;border-color:#DCE3EE}
.evc-t{font-size:13px;font-weight:600;line-height:1.45;text-decoration:none;display:block}
.evc-t:hover{color:var(--sk-orange)}
.evc-m{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:3px}
.span{background:#FAFAF7;border-left:2px solid var(--border);padding:8px 11px;margin-top:9px;font-size:12.5px;line-height:1.6}
.span .orig{font-weight:500}
.span .ko{color:var(--muted);margin-top:5px;font-size:12px}
.span .lb{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--muted);display:block;margin-bottom:4px}
.claim{font-size:12.5px;margin-top:8px;padding-top:8px;border-top:1px dotted var(--border)}
.claim b{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--sk-orange);display:block;margin-bottom:2px}
.fresh{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:10px;padding-top:9px;border-top:1px solid var(--border2);line-height:1.7}
.fresh b{color:var(--text);font-weight:500}
/* cluster */
.clu{border:1px solid var(--border);border-radius:8px;padding:14px 16px;background:var(--panel);margin-top:12px}
.clu h4{margin:0 0 10px;font-size:14px;font-weight:600}
.clr{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:12.5px;border-bottom:1px dotted var(--border2)}
.clr:last-child{border-bottom:none}
.clr .fl{width:22px;flex:0 0 22px;font-size:14px}
.clr .pb{flex:1}
.clr .dt{font-family:var(--mono);font-size:10px;color:var(--muted)}

/* ══ LIVE 데이터 로더 ═══════════════════════════════════════
   data/live.json 이 있으면 시세·뉴스를 덮어쓰고 LIVE 모드로 전환.
   없거나 실패하면 아무 일도 없이 내장 데모 데이터로 동작합니다.
   file:// 로 열면 fetch 가 막히므로 자동으로 건너뜁니다.
   ═══════════════════════════════════════════════════════════ */
const LIVE={on:false,at:null,news:[],status:null,stale:false};
function applyLive(j){
 if(!j)return;
 LIVE.on=true;LIVE.at=j.generatedAt;LIVE.status=j.status||null;
 const ageH=(Date.now()-new Date(j.generatedAt))/36e5;
 LIVE.stale=ageH>36;
 (j.commodity||[]).forEach(c=>{
  const t=COMMOD.find(x=>x.n===c.n)||COMMOD.find(x=>x.n.indexOf(c.n.split(" ")[0])===0);
  if(!t||c.st!=="live")return;
  t.v=c.v;t.d=c.d;t.asof=c.asof;t.st="live";t.dir=c.dir;
  if(c.src)t.src=c.src;
 });
 LIVE.news=(j.news||[]).filter(n=>n.st==="ok");
}
async function loadLive(){
 if(location.protocol==="file:")return;
 try{
  const r=await fetch("./data/live.json?t="+Date.now(),{cache:"no-store"});
  if(!r.ok)return;
  applyLive(await r.json());
  render();
 }catch(e){/* 데모 데이터 유지 */}
}
function liveBadge(){
 if(!LIVE.on)return '<span class="lv demo">DEMO DATASET</span>';
 const d=new Date(LIVE.at);
 const ago=Math.round((Date.now()-d)/36e5);
 return '<span class="lv '+(LIVE.stale?"stale":"on")+'">'+(LIVE.stale?"STALE":"LIVE")+'</span>'
  +'<span class="lv-t">'+d.toISOString().slice(0,16).replace("T"," ")+' · '+ago+'시간 전'
  +(LIVE.status?' · 시세 '+LIVE.status.commodity+' · 기사 '+LIVE.status.articles+'건':'')+'</span>';
}
function liveFeed(){
 if(!LIVE.on||!LIVE.news.length)
  return '<div class="feedoff"><b>실시간 피드 미연결</b>'
   +'<div>data/live.json 이 없어 내장 데모 데이터로 동작 중입니다. '
   +'update-live-data.mjs 를 하루 한 번 돌리면 이 자리에 최신 기사와 시세가 채워집니다. '
   +'로컬 파일(file://)로 열면 브라우저 보안 정책상 항상 이 상태입니다.</div></div>';
 return LIVE.news.map(n=>'<div class="fdg"><div class="fdg-h"><b>'+esc(n.label)+'</b>'
  +'<span>'+n.items.length+'건'+(n.lang?' · '+n.lang:'')+'</span></div>'
  +n.items.slice(0,5).map(a=>'<a class="fd" href="'+a.u+'" target="_blank" rel="noopener">'
   +'<span class="fd-t">'+esc(a.t||"(제목 없음)")+'</span>'
   +'<span class="fd-m">'+esc(a.pub)+' · '+esc(a.d)+(a.lang?' · '+esc(a.lang):'')+' ↗</span></a>').join("")
  +'</div>').join("");
}

 if(s.fx[id])for(const k in s.fx[id])o[k]=(o[k]||0)+s.fx[id][k];});return o;}
function comp(t,base){const o=Object.assign({},t.c);if(!base){const f=fxOf(t.id);
 for(const k in f)o[k]=Math.max(0,Math.min(100,o[k]+f[k]));}return o;}

 return Math.round(c.cr*w.cr+c.sr*w.sr+c.sc*w.sc+c.em*w.em);}

   .map(x=>'<div class="dl"><span>'+x[0]+'</span><b>'+esc(x[1])+'</b></div>').join("")+'</div>'
  +'<div class="dsec"><h5>Why this matters</h5><p>'+esc(c.s)+'</p></div>'
  +'<div class="dsec"><h5>Enterprise risk</h5>'
  +'<div class="eqn"><span>External<b>'+c.dep+'</b><i>공개 신호</i></span><span class="x">×</span>'
  +'<span>Internal<b class="na">—</b><i>미연결</i></span><span class="x">=</span>'
  +'<span>Enterprise<b class="na">—</b><i>계산 불가</i></span></div>'
  +'<p style="font-size:12.5px;color:var(--muted);margin-top:9px">공개 신호만으로는 절반입니다. '
  +'외부 노출이 90이어도 실제 의존이 30이면 관리 가능하고, 외부가 70이어도 내부가 95면 치명적입니다. '
  +'아래 값이 내부 시스템에서 들어와야 진짜 리스크가 계산됩니다.</p>'
  +INTERNAL_FIELDS.map(f=>'<div class="dl"><span>'+esc(f[0])+'</span><b class="na">— <i style="font-style:normal;font-family:var(--mono);font-size:9px">'+esc(f[1])+'</i></b></div>').join("")
  +'</div>';
 }
 if(S.detail==="cmcell"&&S.cell){
  const[rn,cn]=S.cell.split("|");const r=CMAP.find(x=>x.n===rn);if(!r||!r.c[cn])return "";
  const x=r.c[cn],others=CM_CTY.filter(c=>c!==cn&&cmCell(r,c)>0).sort((a,b)=>cmCell(r,b)-cmCell(r,a));
  return '<button class="close" data-a="close">✕</button>'
  +'<div class="mono" style="font-size:10px;color:var(--muted)">'+esc(r.k)+' · '+esc(r.n)+'</div>'
  +'<h3>'+FLAG[CTYCODE[cn]]+' '+esc(cn)+'</h3>'
  +'<div class="sub2">'+["미미","참여","강세","지배"][x.v]+(x.sh?' · '+esc(x.sh):'')+'</div>'
  +'<div class="dsec"><h5>기업</h5>'
  +(x.co.length?x.co.map(c=>'<div class="dl"><span>'+esc(c)+'</span></div>').join("")
   :'<p style="color:var(--muted);font-size:12.5px;margin:0">공개 보도에서 확인된 기업 없음</p>')+'</div>'
  +'<div class="dsec"><h5>구간 메모</h5><p>'+esc(r.note)+'</p></div>'
  +'<div class="dsec"><h5>다른 국가</h5>'
  +others.map(c=>'<button class="dl" style="width:100%" data-a="cmcell" data-v="'+esc(rn)+'|'+c+'">'
   +'<span>'+FLAG[CTYCODE[c]]+' '+esc(c)+'</span><b>'+["·","●","●●","●●●"][cmCell(r,c)]+' →</b></button>').join("")+'</div>'
  +(cn!=="한국"?'<div class="dsec"><h5>국내 위치</h5><p>'
   +(r.c["한국"].co.length?esc(r.c["한국"].co.join(" · "))+' · '+["미미","참여","강세","지배"][cmCell(r,"한국")]
    :'<span style="color:var(--sk-red)">확인된 국내 기업 없음</span>')+'</p></div>':'')
  +'<div class="meth" style="margin-top:18px">등급은 공개 보도 기반 상대 평가입니다. 점유율은 출처가 확인된 것만 표기했고 연도를 함께 적었습니다.</div>';
 }
 if(S.detail==="cell"&&S.cell){
  const[mn,cn]=S.cell.split("|");const m=MATERIAL_MAP.find(x=>x.m===mn);if(!m||!m.cs[cn])return "";
  const cell=m.cs[cn];
  return '<button class="close" data-a="close">✕</button>'
  +'<div class="mono" style="font-size:10px;color:var(--muted)">MATERIAL · '+esc(mn)+'</div>'
  +'<h3>'+FLAG[CTYCODE[cn]]+' '+esc(cn)+'</h3>'
  +'<div class="sub2">'+["Limited","Relevant","Strong","Dominant"][cell.v]+' · Public Signal Presence</div>'
  +'<div class="dsec"><h5>Why</h5>'
  +(cell.why.length?cell.why.map(w=>'<div style="font-size:13.5px;padding:4px 0">· '+esc(w)+'</div>').join("")
   :'<p style="color:var(--muted)">공개 신호에서 확인된 근거 없음.</p>')+'</div>'
  +'<div class="dsec"><div class="dl"><span>원자재 Exposure</span><b>'+m.exp+'</b></div>'
  +'<div class="dl"><span>Confidence</span><b>'+m.conf+'</b></div>'
  +'<div class="dl"><span>근거 문서</span><b>'+m.evn+'</b></div>'
  +'<div class="dl"><span>대체 가능성</span><b>'+m.alt+'</b></div>'
  +'<div class="dl"><span>최종 확인</span><b>'+m.ver+'</b></div></div>'
  +'<div class="dsec"><h5>Affected products</h5>'
  +m.products.map(p=>{const t=TECH.find(x=>x.n===p);
   return t?'<button class="dl" style="width:100%" data-a="tech" data-v="'+t.id+'"><span>'+esc(p)+'</span><b>'+score(t)+' →</b></button>'
    :'<div class="dl"><span>'+esc(p)+'</span></div>';}).join("")+'</div>'
  +'<div class="dsec"><h5>Action</h5><p style="color:var(--sk-orange);font-weight:600">'+esc(m.act)+'</p></div>'
  +'<div class="meth" style="margin-top:18px">이 등급은 생산 점유율이 아니라 공개 신호 등장 강도입니다.</div>';
 }
 if(S.detail==="pcell"&&S.cell){
  const[pn,cn]=S.cell.split("|");const p=PRODUCT_MAP.find(x=>x.p===pn);if(!p||!p.cs[cn])return "";
  const cell=p.cs[cn],t=T(p.tech);
  return '<button class="close" data-a="close">✕</button>'
  +'<div class="mono" style="font-size:10px;color:var(--muted)">PRODUCT · '+esc(pn)+'</div>'
  +'<h3>'+FLAG[CTYCODE[cn]]+' '+esc(cn)+'</h3>'
  +'<div class="sub2">'+["Limited","Relevant","Strong","Dominant"][cell.v]+'</div>'
  +'<div class="dsec"><h5>Why</h5>'
  +(cell.why.length?cell.why.map(w=>'<div style="font-size:13.5px;padding:4px 0">· '+esc(w)+'</div>').join("")
   :'<p style="color:var(--muted)">확인된 근거 없음.</p>')+'</div>'
  +(cell.co&&cell.co.length?'<div class="dsec"><h5>Companies</h5>'
   +cell.co.map(x=>'<div class="dl"><span>'+esc(x)+'</span></div>').join("")+'</div>':'')
  +'<div class="dsec"><h5>SK Exposure</h5><p>'+esc(t.asset)+'</p>'
  +'<p style="margin-top:6px;color:var(--muted);font-size:12.5px">공백 · '+esc(t.gap||"—")+'</p></div>'
  +'<div class="dsec"><h5>Action</h5>'
  +'<div style="font-family:var(--mono);font-size:15px;font-weight:600" class="'+actCls(actOf(t))+'">'+actOf(t)+'</div></div>'
  +'<div class="dsec"><div class="dl"><span>Confidence</span><b>'+p.conf+'</b></div>'
  +'<div class="dl"><span>근거 문서</span><b>'+p.evn+'</b></div>'
  +'<div class="dl"><span>최종 확인</span><b>'+p.ver+'</b></div></div>'
  +'<button class="cta g" data-a="tech" data-v="'+p.tech+'" style="margin-top:14px">기술 상세 →</button>';
 }
 return "";
}

/* ── RENDER ── */
const NAV=[
 {g:"OVERVIEW",items:[["home","오늘의 브리핑"],["exec","Executive Summary"],["queue","Decision Queue"]]},
 {g:"STRATEGY",items:[["bench","Samsung Benchmark"],["demand","Demand · Customers"],["cmap","Competition Map"],["japan","Japan · Kioxia"],["cycle","Cycle Regime"],["outlook","Industry Outlook"],["port","Memory Portfolio"]]},
 {g:"INTELLIGENCE",items:[["brief","Briefing"],["tech","Technology"],["chain","Supply Chain"],["eco","Ecosystem"],["dec","Decisions"]]},
 {g:"TOOLS",items:[["scen","Scenario Lab"],["cal","Trigger Calendar"],["src","Source Intelligence"]]},
 {g:"LIBRARY",items:[["watch","Watchlist"],["meth","Methodology"]]}];
const TITLES={home:["오늘의 브리핑","주요 이벤트 · 원자재 시세"],exec:["Executive Summary","A4 2장 요약 · PDF"],queue:["Decision Queue","곧 결정해야 하는 것"],bench:["Samsung Benchmark","컨센서스 · HBM4 · 대응"],demand:["Demand · Customers","국가별 고객 · 해상 DC"],cmap:["Competition Map","제품 · 국가별 경쟁 구도"],japan:["Japan · Kioxia","팩트체크 · CAPEX · 벤치마킹"],cycle:["Cycle Regime","지금 사이클은 어디"],outlook:["Industry Outlook","낙관 · 중립 · 비관"],port:["Memory Portfolio","HBM · DRAM · NAND"],brief:["Briefing","오늘 확인할 신호"],
 tech:["Technology","기술 변곡점 추적"],chain:["Supply Chain","공급망 · 원자재 · 국가"],
 eco:["Ecosystem","기업 · 관계 · 빈칸"],dec:["Decisions","액션과 선택지"],
 scen:["Scenario Lab","가정과 재계산"],cal:["Trigger Calendar","언제 다시 볼 것인가"],
 src:["Source Intelligence","원문 · 언어 · 출처 계층"],
 watch:["Watchlist","추적 중인 기술"],meth:["Methodology","산출 근거"],search:["Search",""]};

function render(){
 const V={home:vHome,exec:vExec,bench:vBench,demand:vDemand,cmap:vCmap,japan:vJapan,cycle:vCycle,outlook:vOutlook,port:vPort,queue:vQueue,brief:vBrief,tech:vTech,chain:vChain,eco:vEco,dec:vDec,scen:vScen,cal:vCal,src:vSrc,watch:vWatch,meth:vMeth,search:vSearch};
 const crit=EVENTS.filter(e=>e.crit).length;
 const loc=allEv().filter(x=>x.lang!=="ko"&&x.lang!=="en").length;
 const nav=NAV.map(g=>'<div class="sgroup"><h6>'+g.g+'</h6>'
  +g.items.map(i=>'<button class="snav" data-a="nav" data-v="'+i[0]+'" data-on="'+(S.view===i[0]?1:0)+'">'+i[1]
  +(i[0]==="brief"?'<span class="badge hot">'+crit+'</span>':'')+(i[0]==="queue"?'<span class="badge hot">'+TRIGGERS.filter(g=>daysTo(g.d)<=120).length+'</span>':'')+(i[0]==="bench"?'<span class="badge hot">NEW</span>':'')
  +(i[0]==="demand"?'<span class="badge hot">'+HYPERGEO.length+'</span>':'')
  +(i[0]==="cmap"?'<span class="badge">'+CMAP.length+'</span>':'')
  +(i[0]==="japan"?'<span class="badge hot">FACT</span>':'')
  +(i[0]==="exec"?'<span class="badge">PDF</span>':'')
  +(i[0]==="cycle"?'<span class="badge hot">'+WATCH.filter(w=>w.st==="TURN").length+'</span>':'')+(i[0]==="outlook"?'<span class="badge">'+OUTLOOK.reduce((a,m)=>a+m.items.length,0)+'</span>':'')
  +(i[0]==="src"?'<span class="badge hot">'+loc+'</span>':'')
  +(i[0]==="watch"&&S.watch.length?'<span class="badge">'+S.watch.length+'</span>':'')
  +(i[0]==="scen"&&S.scen.length?'<span class="badge hot">'+S.scen.length+'</span>':'')+'</button>').join("")+'</div>').join("")
  +(S.recent.length?'<div class="sgroup"><h6>RECENT</h6><div class="recent">'
   +S.recent.map(id=>'<button data-a="tech" data-v="'+id+'">'+esc(T(id).n)+'</button>').join("")+'</div></div>':'');
 const ttl=TITLES[S.view]||["",""],dp=detailPanel();
 document.getElementById("app").innerHTML=
 '<div class="shell" data-detail="'+(dp?1:0)+'">'
 +'<aside class="sidebar"><div class="brand"><div class="top"><span class="dotb"></span>'
 +'<div class="co">SK hynix</div></div><div class="pr">Strategic Intelligence</div>'
 +'<div class="un">비공식 · 개인 데모</div></div>'+nav+'</aside>'
 +'<main class="workspace"><header class="topbar">'
 +'<span class="tb-t">'+esc(ttl[0])+'</span><span class="tb-s">'+esc(ttl[1])+'</span>'
 +'<div class="tb-search"><span>⌕</span><input id="q" placeholder="기술 · 원자재 · 기업 · 원문 검색" value="'+esc(S.q)+'"></div>'
 +'<div class="tb-act"><button data-a="nav" data-v="src">Sources</button>'
 +'<button data-a="nav" data-v="meth">Methodology</button></div></header>'
 +'<section class="content'+(S.view==="dec"||S.view==="scen"?" wide":"")+'">'+V[S.view]()
 +'<p style="font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.9;margin-top:40px;padding-top:16px;border-top:1px solid var(--border)">'
 +'사실은 2026-08-09까지의 실제 공개 보도이며 원문 링크 · 원문 인용 구절 · 출처 계층이 붙어 있습니다. '
 +'EST 표기 값 · 액션 분류 · 시나리오 · 맵 등급은 이 도구의 추정이며 생산 점유율이나 조달 데이터가 아닙니다. '
 +'수집 파이프라인은 없고 원문은 사람이 검색해 넣은 것입니다. 개인 데모이며 SK하이닉스의 공식 견해가 아닙니다.</p>'
 +'</section></main>'+(dp?'<aside class="detail">'+dp+'</aside>':'')+'</div>';
 const qi=document.getElementById("q");
 if(qi)qi.addEventListener("input",e=>{S.q=e.target.value;
  if(S.q.trim()){S.view="search";render();focusEl("q");}else{S.view="home";render();focusEl("q");}});
 const ai=document.getElementById("ask");
 if(ai)ai.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.value.trim()){S.ans=answer(e.target.value.trim());render();}});
}
function focusEl(id){const el=document.getElementById(id);if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}}

document.getElementById("app").addEventListener("click",e=>{
 const el=e.target.closest("[data-a]");if(!el)return;
 const a=el.dataset.a,v=el.dataset.v;
 if(a==="nav"){
  S.view=v;S.q="";
  if(v==="tech"){if(S.detail!=="tech"){S.detail=null;S.node=null;}}
  else if(v==="chain"){if(["node","cty","cell","pcell"].indexOf(S.detail)<0){S.detail=null;S.node=null;}}
  else{S.detail=null;S.node=null;S.cell=null;}
 }
 else if(a==="tech"){openTech(v);if(["search","home","brief","cal","src","queue"].indexOf(S.view)>=0)S.view="tech";S.q="";S.cell=null;}
 else if(a==="ev"){S.node=v;S.detail="ev";S.cell=null;}
 else if(a==="node"){if(S.node===v&&S.detail==="node"){S.node=null;S.detail=null;}else{S.node=v;S.detail="node";S.cell=null;}}
 else if(a==="cty"){S.node=v;S.detail="cty";S.cell=null;}
 else if(a==="cell"){S.cell=v;S.detail="cell";}
 else if(a==="pcell"){S.cell=v;S.detail="pcell";}
 else if(a==="eco"){S.ecoTech=v;S.view="eco";S.detail=null;S.q="";}
 else if(a==="chainview"){S.chainView=v;S.view="chain";S.q="";if(v!=="material"&&v!=="product"){S.detail=null;S.cell=null;}}
 else if(a==="srcview")S.srcView=v;
 else if(a==="ask-toggle")S.ask=!S.ask;
 else if(a==="camp")S.camp=v;
 else if(a==="jpview")S.jpView=v;
 else if(a==="dmview")S.dmView=v;
 else if(a==="cmview"){S.cmView=v;S.detail=null;S.cell=null;}
 else if(a==="cmcell"){S.cell=v;S.detail="cmcell";S.view="cmap";}
 else if(a==="print"){window.print();return;}
 else if(a==="close"){S.detail=null;S.node=null;S.cell=null;}
 else if(a==="star")S.watch=S.watch.indexOf(v)>=0?S.watch.filter(x=>x!==v):S.watch.concat([v]);
 else if(a==="scen"){if(S.scen.indexOf(v)<0)S.scen.push(v);}
 else if(a==="unscen")S.scen=S.scen.filter(x=>x!==v);
 else if(a==="reset")S.scen=[];
 else if(a==="sq"){S.ans=answer(v);S.view="home";}
 else if(a==="ask"){const el2=document.getElementById("ask");if(el2&&el2.value.trim())S.ans=answer(el2.value.trim());}
 render();
 if(a==="tech"||a==="nav"||a==="chainview")window.scrollTo(0,0);
});
render();
loadLive();
</script>
