# .github/workflows/daily-update.yml
# 매일 원자재 시세와 뉴스를 수집해 data/live.json 을 커밋합니다.
# 서버 없음 · 비용 없음 · GitHub Pages 가 그대로 서빙합니다.

name: daily-update

on:
  schedule:
    # UTC 기준 22:00 = 한국시간 07:00 (매일 아침 출근 전)
    - cron: "0 22 * * *"
  workflow_dispatch: {}        # 수동 실행 버튼

permissions:
  contents: write              # data/live.json 커밋 권한

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 데이터 수집
        run: node update-live-data.mjs
        # 유료 API를 쓸 경우에만 필요합니다.
        # 키는 반드시 Settings → Secrets → Actions 에 넣고 여기서 주입하십시오.
        # env:
        #   METALS_API_KEY: ${{ secrets.METALS_API_KEY }}

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "data: $(date -u +%Y-%m-%d) 시세·뉴스 갱신"
            git push
          fi
